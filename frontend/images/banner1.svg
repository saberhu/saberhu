<svg xmlns="http://www.w3.org/2000/svg" width="750" height="300" viewBox="0 0 750 300">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f2994a"/>
      <stop offset="100%" style="stop-color:#f2c94c"/>
    </linearGradient>
  </defs>
  <rect width="750" height="300" fill="url(#bg1)"/>
  <!-- 装饰圆 -->
  <circle cx="650" cy="50" r="120" fill="rgba(255,255,255,0.03)"/>
  <circle cx="700" cy="80" r="80" fill="rgba(255,255,255,0.02)"/>
  <circle cx="100" cy="250" r="100" fill="rgba(255,255,255,0.03)"/>
  <!-- 台球桌装饰 -->
  <rect x="520" y="60" width="180" height="130" rx="65" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <rect x="540" y="75" width="140" height="100" rx="50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <!-- 台球 -->
  <circle cx="560" cy="110" r="8" fill="#f5f5dc" opacity="0.9"/>
  <circle cx="590" cy="100" r="8" fill="#f5f5dc" opacity="0.9"/>
  <circle cx="620" cy="115" r="8" fill="#f5f5dc" opacity="0.9"/>
  <circle cx="650" cy="105" r="8" fill="#e74c3c" opacity="0.9"/>
  <circle cx="580" cy="130" r="8" fill="#f5f5dc" opacity="0.9"/>
  <circle cx="610" cy="135" r="8" fill="#f5f5dc" opacity="0.9"/>
  <!-- 主标题 -->
  <text x="60" y="130" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" letter-spacing="2">阜阳台球约战</text>
  <!-- 副标题 -->
  <text x="60" y="175" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.6)" letter-spacing="1">阜阳球友聚集地 · 以球会友</text>
  <!-- 按钮 -->
  <rect x="60" y="205" width="120" height="36" rx="18" fill="url(#glow1)"/>
  <text x="120" y="228" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e" text-anchor="middle">立即约战</text>
  <!-- 装饰星星 -->
  <text x="420" y="80" font-size="14" fill="rgba(255,255,255,0.15)">✦</text>
  <text x="380" y="200" font-size="10" fill="rgba(255,255,255,0.1)">✦</text>
  <text x="460" y="160" font-size="8" fill="rgba(255,255,255,0.12)">✦</text>
</svg>
