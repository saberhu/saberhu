





# ============================================================
# 阜阳台球约战小程序 - Docker Compose 本地开发环境
# 一键启动 MySQL 8.0 + 后端服务
# ============================================================
version: '3.8'

services:
  # MySQL 数据库
  db:
    image: mysql:8.0
    container_name: billiards-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: billiards
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 启动时自动执行初始化脚本建表
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: billiards-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 通过服务名 mysql 连接数据库
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: billiards
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:





